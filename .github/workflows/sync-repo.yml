name: Sync MangaSync repository

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install protobuf grpcio-tools
      - run: python -m grpc_tools.protoc --python_out=scripts scripts/index.proto
      - run: python scripts/sync_repo.py
      - name: Validate generated index
        run: |
          python - <<'PY'
          import gzip
          import sys
          sys.path.insert(0, 'scripts')
          import index_pb2
          raw = gzip.decompress(open('index.pb', 'rb').read())
          msg = index_pb2.Index()
          msg.ParseFromString(raw)
          print('Valid protobuf index:', len(msg.extensionList.extensions), 'extensions')
          PY
      - name: Commit updated index
        run: |
          git config user.name 'MangaSync Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json index.min.json index.pb index.html release-assets.json scripts/index_pb2.py
          git diff --cached --quiet || git commit -m 'Sync selected Mihon extensions'
          git push
